backend:
  name: git-gateway
  branch: main

site_url: https://tdaniloj.github.io/Herdeiros-do-Gelo/
display_url: https://tdaniloj.github.io/Herdeiros-do-Gelo/
logo_url: https://tdaniloj.github.io/Herdeiros-do-Gelo/favicon.svg
show_preview_links: false
local_backend: false
publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/Herdeiros-do-Gelo/images/uploads"

collections:
  - name: site
    label: Configurações do site
    files:
      - label: Identidade
        name: identidade
        file: "content/site/identidade.yml"
        fields:
          - { label: Nome do estúdio, name: studio_name, widget: string }
          - { label: Descrição curta, name: description, widget: text }
          - { label: E-mail público, name: contact_email, widget: string, required: false }
          - { label: Título da página inicial, name: home_title, widget: string }
          - { label: Texto de destaque, name: home_lede, widget: text }
          - { label: Nome do projeto em destaque, name: featured_project, widget: string }
  - name: mundo
    label: Mundo da obra
    files:
      - label: Configuração do mundo
        name: mundo
        file: "content/site/mundo.yml"
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Descrição, name: description, widget: text }
          - { label: Texto de introdução, name: intro, widget: text }
  - name: seo
    label: SEO e compartilhamento
    files:
      - label: Metadados
        name: seo
        file: "content/site/seo.yml"
        fields:
          - { label: Título do site, name: title, widget: string }
          - { label: Descrição, name: description, widget: text }
          - { label: URL pública, name: site_url, widget: string }
          - { label: Imagem de compartilhamento, name: social_image, widget: image, required: false }
  - name: legal
    label: Informações legais
    files:
      - label: Direitos e contato
        name: legal
        file: "content/site/legal.yml"
        fields:
          - { label: Titular dos direitos, name: rights_holder, widget: string }
          - { label: Ano do copyright, name: copyright_year, widget: number, value_type: int }
          - { label: E-mail para solicitações, name: contact_email, widget: string, required: false }
          - { label: Observação legal, name: notice, widget: text }
  - name: noticias
    label: Notícias
    folder: "content/noticias"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Status, name: status, widget: select, options: ["Publicado", "Em desenvolvimento", "Anúncio"] }
      - { label: Resumo, name: summary, widget: text }
      - { label: Conteúdo, name: body, widget: markdown }
  - name: personagens
    label: Personagens
    folder: "content/personagens"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Nome, name: name, widget: string }
      - { label: Papel, name: role, widget: string, required: false }
      - { label: Grupo, name: group, widget: string, required: false, hint: "Ex.: glace, voss, cinzas ou fera" }
      - { label: Imagem, name: image, widget: image, required: false }
      - { label: Descrição, name: description, widget: text }
      - { label: Conteúdo adicional, name: body, widget: markdown, required: false }
  - name: capitulos
    label: Capítulos
    folder: "content/capitulos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Número, name: number, widget: number, value_type: int }
      - { label: Título, name: title, widget: string }
      - { label: Resumo, name: summary, widget: text }
      - { label: Conteúdo, name: body, widget: markdown }
